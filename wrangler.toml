name = "emad-afandi-games-hub"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "emad-afandi-games-db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with your D1 DB UUID

# Cloudflare R2 Bucket binding
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "emad-afandi-assets"

[vars]
ENVIRONMENT = "production"
